# Local dev infra. Not required until Teammate 1 needs a real DB/Kafka
# instance to connect to - can be added incrementally, doesn't need to
# exist on day 1.
#
# Usage: docker compose up -d

version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthlens
      POSTGRES_PASSWORD: healthlens
      POSTGRES_DB: healthlens
    ports:
      - "5432:5432"
    volumes:
      - docker-data/postgres:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
